name: Database migration check

on:
  pull_request:
    paths:
      - "web/supabase/**"
      - "web/scripts/check-migrations.sh"
      - ".github/workflows/database-check.yml"
  push:
    branches:
      - main
    paths:
      - "web/supabase/**"
      - "web/scripts/check-migrations.sh"
      - ".github/workflows/database-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test migrations on fresh PostgreSQL
        run: bash web/scripts/check-migrations.sh